[package]
name = "bridge-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for Coachly Code Bridge - P2P file sharing for developers"

[[bin]]
name = "codebridge"
path = "src/main.rs"

[dependencies]
# Core library
bridge-core = { path = "../bridge-core" }

# Async runtime
tokio = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Utilities
humansize = { workspace = true }
chrono = { workspace = true }

# Terminal UI
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"
